{% extends 'shelter_project/base.html' %}

{% block content %}
    <h2>Add a new animal</h2>

    {% if at_capacity %}
        <p>The shelter already has the maximum of 50 available animals.</p>
    {% else %}
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Add animal</button>
        </form>
    {% endif %}

    <p><a href="{% url 'animal_list' %}">Back to animals</a></p>
{% endblock %}
