{% extends 'shelter_project/base.html' %}

{% block content %}
    <h2>Edit {{ animal.name }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save changes</button>
    </form>
    <p><a href="{% url 'animal_list' %}">Cancel</a></p>
{% endblock %}
