{% extends "shelter_project/base.html" %}

{% block content %}

<!-- Login page for both customer and employee accounts-->
<h1>Login</h1>

{% if error_message %}
    <p>{{ error_message }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label for="username">Username:</label>
    <input
        type="text"
        id="username"
        name="username"
        required
    >

    <br><br>

    <label for="password">Password:</label>
    <input
        type="password"
        id="password"
        name="password"
        required
    >

    <br><br>

    <button type="submit">Login</button>
</form>

<!-- Link for new users to create an account -->
<p>
    Don't have an account?
    <a href="{% url 'register_customer' %}">Create Account</a>
</p>

{% endblock %}
