{% extends "shelter_project/base.html" %}

{% block content %}

<h1>Employee Profile</h1>
<!-- Return to the employee dashboard-->
<p>
    <a href="{% url 'employee_dashboard' %}">Back to Dashboard</a>
</p>

<!-- Employee profile form-->
<form method="post">
    {% csrf_token %}

    {{ employee_profile_form.as_p }}

    <button type="submit">Save Profile</button>
</form>
<p>
    <a href="{% url 'logout' %}">Logout</a>
</p>

{% endblock %}
