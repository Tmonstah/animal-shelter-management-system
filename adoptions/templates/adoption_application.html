{% extends "shelter_project/base.html" %}

{% block content %}

<!-- Adoption application page -->
<h1>Adoption Application</h1>

<p>
    You are applying to adopt <strong>{{ animal.name }}</strong>.
</p>

<form method="post">
    {% csrf_token %}

    {{ adoption_application_form.as_p }}

    <button type="submit">Submit Application</button>
</form>

{% endblock %}
